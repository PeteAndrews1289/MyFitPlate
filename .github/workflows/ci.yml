name: CI

# Builds the app, runs the app unit suite, and runs the Core package tests on every
# push / PR to main so logic regressions are caught before they reach an archive.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: macos-15
    concurrency:
      group: ci-unit-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      # secrets.xcconfig is gitignored. The unit tests are pure logic and never call
      # OpenAI or FatSecret, so empty placeholders are enough for the app target to
      # compile. (Keep values free of "//" — xcconfig treats it as a comment.)
      - name: Provide placeholder build secrets
        run: |
          cat > secrets.xcconfig <<'EOF'
          FATSECRET_PROXY_URL =
          OPENAI_API_KEY =
          USDA_API_KEY =
          EOF

      - name: Run SwiftLint
        run: swiftlint lint --strict --quiet

      - name: Enforce visual-system boundaries
        run: ./scripts/check_visual_system.sh

      - name: Validate privacy metadata
        run: bash ./scripts/check_privacy_metadata.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MyFitPlate.xcodeproj \
            -scheme MyFitPlate

      - name: Run Core package tests
        run: swift test --enable-code-coverage --package-path MyFitPlateCore

      - name: Check Core coverage floor
        env:
          CORE_COVERAGE_MINIMUM: "80.0"
        run: ./scripts/check_core_coverage.sh

      - name: Set up Node for native persistence tests
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up Java for native persistence tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Run unit tests
        run: |
          gem install xcpretty
          set -o pipefail
          npx -y firebase-tools emulators:exec \
            --project myfitplate-test-project \
            --only firestore,auth \
            'xcodebuild test \
            -project MyFitPlate.xcodeproj \
            -scheme MyFitPlate \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -only-testing:MyFitPlateTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            MYFITPLATE_EMULATOR_TESTS=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            OTHER_SWIFT_FLAGS="-D UI_TESTING"' | xcpretty

      - name: Check coverage floor
        env:
          # Native persistence and app rendering tests establish 12.29% locally. Keep
          # headroom for SDK differences while catching a meaningful regression.
          COVERAGE_MINIMUM: "10.0"
        run: python3 scripts/check_xcode_coverage.py TestResults.xcresult --target MyFitPlate.app

      - name: Build Release configuration
        run: |
          xcodebuild build -quiet \
            -project MyFitPlate.xcodeproj \
            -scheme MyFitPlate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  ui-tests:
    name: UI tests · ${{ matrix.shard }}/4
    runs-on: macos-15
    concurrency:
      # Finish each running release shard so failures near its end remain visible.
      # Other checks, and shards that are already free, can test the new revision.
      group: ci-ui-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ !startsWith(github.head_ref, 'codex/release-') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Provide placeholder build secrets
        run: |
          cat > secrets.xcconfig <<'EOF'
          FATSECRET_PROXY_URL =
          OPENAI_API_KEY =
          USDA_API_KEY =
          EOF

      - name: Build and run the assigned UI suites sequentially
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          common=(-project MyFitPlate.xcodeproj -scheme MyFitPlate
                  -destination 'platform=iOS Simulator,name=iPhone 16'
                  -derivedDataPath "$RUNNER_TEMP/MyFitPlateUI" -parallel-testing-enabled NO)
          xcodebuild build-for-testing "${common[@]}" CODE_SIGN_IDENTITY=-
          xcodebuild test-without-building "${common[@]}" -only-testing:MyFitPlateUITests \
            -enumerate-tests -test-enumeration-style flat -test-enumeration-format text \
            -test-enumeration-output-path "$RUNNER_TEMP/ui-tests.txt"
          python3 scripts/ui_test_partition.py "$RUNNER_TEMP/ui-tests.txt" "$SHARD" 4 > "$RUNNER_TEMP/ui-suites.txt"
          suites=()
          while IFS= read -r suite; do suites+=("-only-testing:$suite"); done < "$RUNNER_TEMP/ui-suites.txt"
          xcodebuild test-without-building "${common[@]}" "${suites[@]}" \
            -collect-test-diagnostics on-failure -resultBundlePath UITestResults.xcresult | tee UITestResults.log

      - name: Upload UI test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            UITestResults.xcresult
            UITestResults.log
          if-no-files-found: ignore

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    concurrency:
      group: ci-functions-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Test, build, and audit Functions
        working-directory: functions
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=moderate

  firebase-rules:
    name: Firebase rules
    runs-on: ubuntu-latest
    concurrency:
      group: ci-rules-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/firebase-rules/package-lock.json

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install rule-test dependencies
        working-directory: tests/firebase-rules
        run: npm ci

      - name: Build callable handlers for compatibility tests
        working-directory: functions
        run: npm ci && npm run build

      - name: Run Firestore rules and account compatibility tests
        run: |
          npx -y firebase-tools emulators:exec \
            --project myfitplate-test-project \
            --only firestore,auth \
            "npm test --prefix tests/firebase-rules && node --test functions/integration/accountDeletionCompatibility.test.js"

  data-migrations:
    name: Data migrations
    runs-on: ubuntu-latest
    concurrency:
      group: ci-migrations-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run migration-runner tests
        working-directory: tools/firestore-migrate
        run: node --test test/*.test.js
